[project]
name = "fsdc-calories"
version = "0.13.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Alejandro Ouslan", email = "alejandro.ouslan@upr.edu" }]
requires-python = ">=3.12"
dependencies = [
    "altair[all]>=6.2.1",
    "censusforge>=0.7.1",
    "fastexcel>=0.20.2",
    "jp-imports>=1.4.1",
]

[project.scripts]
fsdc-calories = "fsdc_calories:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "cairosvg>=2.9.0",
  "fastexcel>=0.20.2",
  "jupyter>=1.1.1",
  "jupytext>=1.19.4",
  "kaleido>=1.3.0",
  "pnglatex>=1.1",
  "pre-commit>=4.6.0",
  "pynvim>=0.5.2",
  "pyperclip>=1.11.0",
]
